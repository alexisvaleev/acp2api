name: Release

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Format, vet and test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./... -race -count=1

  release:
    name: Build and publish release binaries
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Build binaries
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        mkdir -p dist
        module="github.com/quonaro/acp2api"
        ldflags="-s -w -X ${module}/internal/version.Version=${VERSION}"
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
          os="${target%/*}"
          arch="${target#*/}"
          name_os="${os}"
          if [ "${os}" = "darwin" ]; then name_os="macos"; fi
          out="dist/acp2api-${name_os}-${arch}"
          if [ "${os}" = "windows" ]; then out="${out}.exe"; fi
          echo "building ${os}/${arch} -> ${out}"
          CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
            go build -trimpath -ldflags "${ldflags}" -o "${out}" ./cmd/acp2api
        done
        (cd dist && sha256sum * > checksums.txt)
        ls -lh dist

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
