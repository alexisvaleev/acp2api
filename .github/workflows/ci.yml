name: CI

on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, vet, lint and test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

    # Pinned to the version the pre-commit hook runs locally, so a green hook
    # cannot disagree with the runner.
    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.14.0

    - name: Test
      run: go test ./... -race -count=1
