shell: bash

vars:
- BINARY=acp2api
- PKG=./cmd/acp2api
- OUT=bin/acp2api
- LDFLAGS=-s -w

dev:
  desc: Run the gateway in development mode
  color: green
  args:
  - addr:str=127.0.0.1:8720
  - workspace|w:str=.
  - permission|p:str=allow
  script: |
    air \
      -tmp_dir "bin" \
      -build.cmd "go build -o ./bin/$BINARY $PKG" \
      -build.entrypoint "./bin/$BINARY" \
      -build.args_bin "serve --config config.yaml --addr $addr --workspace $workspace --permission $permission --verbose" \
      -build.exclude_dir "assets,tmp,vendor,testdata,bin,workspace,reference,.git"

build:
  desc: Build the gateway binary
  color: cyan
  script: |
    set -euo pipefail
    go build -trimpath -ldflags "$LDFLAGS" -o "$OUT" $PKG
    ls -lh "$OUT"

push:
  desc: Push to GitHub
  color: cyan
  args:
  - "tag:str?"
  script: |
    if [ -n "$tag" ]; then
      git tag -f "$tag"
      git push origin "$tag" --force
    fi
    git push
